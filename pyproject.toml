[build-system]
requires = ["uv_build>=0.12.20,<0.13"]
build-backend = "uv_build"

[project]
name = "aws-google-auth"
version = "0.0.38"
description = "Acquire AWS STS (temporary) credentials via Google Apps SAML Single Sign On"
readme = "README.rst"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Colin Panisset", email = "colin.panisset@cevo.com.au" },
]
maintainers = [
    { name = "Amit Prakash Ambasta" },
]
keywords = ["saml", "sso", "federated identity", "google", "aws", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
    "Typing :: Typed",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "boto3>=1.34",
    "filelock>=3.12",
    "keyring>=24",
    "keyrings.alt>=5",
    "lxml>=5",
    "Pillow>=10",
    "requests>=2.31",
    "tabulate>=0.9",
    "tzlocal>=5",
]

[project.optional-dependencies]
u2f = ["python-u2flib-host>=3"]

[project.urls]
Homepage = "https://github.com/ambasta/aws-google-auth"
Documentation = "https://github.com/ambasta/aws-google-auth#readme"
Issues = "https://github.com/ambasta/aws-google-auth/issues"
Source = "https://github.com/ambasta/aws-google-auth"
Upstream = "https://github.com/cevoaustralia/aws-google-auth"

[project.scripts]
aws-google-auth = "aws_google_auth:main"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "docs" },
]
lint = [
    "ruff>=0.16",
]
test = [
    "coverage>=7",
    "coveralls>=4",
    "pytest>=8",
]
docs = [
    "Pygments>=2",
    "restructuredtext-lint>=1.4",
]

[tool.uv.build-backend]
module-root = ""
wheel-exclude = ["aws_google_auth/tests"]

[tool.pytest.ini_options]
testpaths = ["aws_google_auth/tests"]
addopts = ["--strict-markers", "--strict-config"]

[tool.coverage.run]
source = ["aws_google_auth"]
omit = ["aws_google_auth/tests/*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",
]
ignore = [
    "E501",  # ruff format owns line length; long strings and URLs are left alone
]
